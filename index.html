<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F3D2E">
<title>Vægt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">VÆGT</div>
    <h1>Log på</h1>
    <p>Personlig vægt-tracking med daglig score</p>
    <button id="googleSignIn" class="google-btn">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Fortsæt med Google
    </button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- ============ LOADING ============ -->
<div id="loadingScreen" class="loading" style="display:none">
  <div class="spinner"></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <h1>Vægt</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="container">
    <!-- HERO -->
    <section class="hero">
      <div class="saving-badge" id="savingBadge">Gemmer</div>
      <div class="hero-header">
        <div>
          <div class="hero-date" id="heroDate"></div>
          <div class="hero-day" id="heroDay"></div>
        </div>
        <div class="date-nav">
          <button id="prevDay" aria-label="Forrige dag">‹</button>
          <button id="todayBtn" aria-label="I dag">•</button>
          <button id="nextDay" aria-label="Næste dag">›</button>
        </div>
      </div>

      <div class="weight-block">
        <div class="weight-input-wrap">
          <label>Vægt</label>
          <input type="text" id="weightInput" placeholder="—" inputmode="decimal" autocomplete="off" enterkeyhint="done">
        </div>
        <div class="weight-target">
          <div class="target-point-badge" id="targetPointBadge">+1 point</div>
          <label>Mål i dag</label>
          <div class="value" id="targetValue">—</div>
          <div class="diff" id="targetDiff">&nbsp;</div>
        </div>
      </div>

      <div class="score-display zone-none" id="scoreDisplay">
        <div class="score-number" id="scoreNumber">0</div>
        <div class="score-meta">
          <div class="score-label" id="scoreLabel">Score i dag</div>
          <div class="score-verdict" id="scoreVerdict">Ingen aktiviteter</div>
        </div>
        <div class="score-max">/ 10</div>
      </div>
    </section>

    <!-- AKTIVITETER -->
    <section class="activities-card">
      <div class="section-header">
        <div class="section-title">Aktiviteter</div>
        <div class="section-hint">Tryk for at markere</div>
      </div>

      <div class="activity-group">
        <div class="group-label">Motion</div>
        <div class="activity-grid" id="motionGrid"></div>
      </div>

      <div class="activity-group">
        <div class="group-label">Mad</div>
        <div class="activity-grid" id="foodGrid"></div>
      </div>
    </section>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">7 dg. snit</div>
        <div class="stat-value" id="stat7">—</div>
        <div class="stat-unit">kg</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Streak</div>
        <div class="stat-value" id="statStreak">—</div>
        <div class="stat-unit">dg. ≥4</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Afv. fra mål</div>
        <div class="stat-value" id="statDiff">—</div>
        <div class="stat-unit">kg</div>
      </div>
    </div>

    <!-- CHART -->
    <section class="chart-card">
      <div class="section-header">
        <div class="section-title">Udvikling</div>
      </div>
      <div class="chart-tabs">
        <button class="chart-tab active" data-range="30">30 dage</button>
        <button class="chart-tab" data-range="90">90 dage</button>
        <button class="chart-tab" data-range="all">Alt</button>
      </div>
      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-swatch" style="background: var(--moss-deep)"></div>Faktisk</div>
        <div class="legend-item"><div class="legend-line" style="background: var(--sage)"></div>7-dg. snit</div>
        <div class="legend-item"><div class="legend-dash" style="border-top-color: var(--ink-mute)"></div>Mål</div>
      </div>
    </section>

    <!-- SCORE CHART -->
    <section class="chart-card">
      <div class="section-header">
        <div class="section-title">Daglig score</div>
      </div>
      <div class="chart-container" style="height: 160px">
        <canvas id="scoreChart"></canvas>
      </div>
    </section>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="menuModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="userName">—</div>
    <div class="modal-sub" id="userEmail">—</div>

    <button class="menu-item" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Eksportér som CSV
    </button>

    <button class="menu-item" id="signOutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Log ud
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  <span id="toastText">Gemt</span>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
